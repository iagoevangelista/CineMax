apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: postgres-facturacion
  name: postgres-facturacion
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres-facturacion
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: postgres-facturacion
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: sales_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              value: cine
          image: postgres:16
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cine
                - -d
                - sales_db
            failureThreshold: 10
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
          name: postgres-facturacion
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata-facturacion
            - mountPath: /docker-entrypoint-initdb.d
              name: postgres-facturacion-cm1
      restartPolicy: Always
      volumes:
        - name: pgdata-facturacion
          persistentVolumeClaim:
            claimName: pgdata-facturacion
        - configMap:
            name: postgres-facturacion-cm1
          name: postgres-facturacion-cm1
