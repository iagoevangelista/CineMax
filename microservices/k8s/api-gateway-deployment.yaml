apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-gateway
  template:
    metadata:
      labels:
        io.kompose.service: api-gateway
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z service-discovery 8761 && nc -z config-server 8888; do
                echo "Waiting for service-discovery:8761 and config-server:8888..."
                sleep 2
              done
              echo "Dependencies are ready!"
      containers:
        - env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Deureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/ -Deureka.instance.prefer-ip-address=true"
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
          image: cinemax/api-gateway
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            initialDelaySeconds: 360
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          name: api-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
