apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mongodb-cartelera
  name: mongodb-cartelera
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongodb-cartelera
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mongodb-cartelera
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: MONGO_INITDB_ROOT_USERNAME
              value: cine
          image: mongo:7
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
            failureThreshold: 10
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 5
          name: mongodb-cartelera
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: mongodata-cartelera
            - mountPath: /docker-entrypoint-initdb.d
              name: mongodb-cartelera-cm1
      restartPolicy: Always
      volumes:
        - name: mongodata-cartelera
          persistentVolumeClaim:
            claimName: mongodata-cartelera
        - configMap:
            name: mongodb-cartelera-cm1
          name: mongodb-cartelera-cm1
