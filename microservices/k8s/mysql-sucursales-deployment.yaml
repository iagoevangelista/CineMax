apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mysql-sucursales
  name: mysql-sucursales
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mysql-sucursales
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mysql-sucursales
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: sucursales_db
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: MYSQL_USER
              value: cine
          image: mysql:8
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            failureThreshold: 10
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 5
          name: mysql-sucursales
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysqldata-sucursales
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-sucursales-cm1
      restartPolicy: Always
      volumes:
        - name: mysqldata-sucursales
          persistentVolumeClaim:
            claimName: mysqldata-sucursales
        - configMap:
            name: mysql-sucursales-cm1
          name: mysql-sucursales-cm1
