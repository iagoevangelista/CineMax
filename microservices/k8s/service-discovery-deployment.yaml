apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: service-discovery
  name: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: service-discovery
  template:
    metadata:
      labels:
        io.kompose.service: service-discovery
    spec:
      containers:
        - image: cinemax/service-discovery
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          name: service-discovery
          ports:
            - containerPort: 8761
              protocol: TCP
      restartPolicy: Always
