apiVersion: v1
data:
  01-init-cartelera.js: |
    db = db.getSiblingDB('cartelera_db');

    db.createCollection('movie');
    db.createCollection('showtime');

    db.genre.drop();
    db.createCollection('genre');
    db.genre.insertMany([
        { nameGenre: "Acción" },
        { nameGenre: "Aventura" },
        { nameGenre: "Ciencia Ficción" },
        { nameGenre: "Comedia" },
        { nameGenre: "Drama" },
        { nameGenre: "Terror" },
        { nameGenre: "Animación" },
        { nameGenre: "Romance" }
    ]);

    db.classification.drop();
    db.createCollection('classification');
    db.classification.insertMany([
        { nameClassification: "APT", descriptionText: "Apto para todo público" },
        { nameClassification: "PG-13", descriptionText: "Mayores de 13 años" },
        { nameClassification: "PG-18", descriptionText: "Mayores de 18 años" }
    ]);

    db.movie.insertMany([
        {
            titleMovie: "Interestelar",
            synopsis: "Un grupo de exploradores viaja a través de un agujero de gusano en el espacio en un intento de garantizar la supervivencia de la humanidad.",
            durationMinutes: 169,
            posterUrl: "",
            releaseDate: new Date("2026-07-01"),
            status: "Activo",
            director: "Christopher Nolan",
            genres: [
                { nameGenre: "Ciencia Ficción" },
                { nameGenre: "Aventura" },
                { nameGenre: "Drama" }
            ],
            classification: {
                nameClassification: "PG-13",
                descriptionText: "Mayores de 13 años"
            },
            premiereWeek: true,
            isActive: true,
            createdAt: new Date()
        },
        {
            titleMovie: "Sonic 3",
            synopsis: "Sonic se enfrenta a un nuevo y poderoso enemigo mientras descubre los secretos del pasado.",
            durationMinutes: 110,
            posterUrl: "",
            releaseDate: new Date("2026-06-20"),
            status: "Activo",
            director: "Jeff Fowler",
            genres: [
                { nameGenre: "Animación" },
                { nameGenre: "Aventura" },
                { nameGenre: "Comedia" }
            ],
            classification: {
                nameClassification: "APT",
                descriptionText: "Apto para todo público"
            },
            premiereWeek: false,
            isActive: true,
            createdAt: new Date()
        },
        {
            titleMovie: "El Conjuro 4",
            synopsis: "Los Warren enfrentan uno de los casos más aterradores de su carrera.",
            durationMinutes: 120,
            posterUrl: "",
            releaseDate: new Date("2026-07-10"),
            status: "Activo",
            director: "Michael Chaves",
            genres: [
                { nameGenre: "Terror" },
                { nameGenre: "Drama" }
            ],
            classification: {
                nameClassification: "PG-18",
                descriptionText: "Mayores de 18 años"
            },
            premiereWeek: true,
            isActive: true,
            createdAt: new Date()
        }
    ]);

    const movies = db.movie.find({}, { _id: 1, titleMovie: 1 }).toArray();

    function getMovieId(title) {
        return movies.find(m => m.titleMovie === title)._id;
    }

    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dayAfter = new Date(today);
    dayAfter.setDate(dayAfter.getDate() + 2);

    function makeShowtime(date, hour, minute) {
        const dt = new Date(date);
        dt.setHours(hour, minute, 0, 0);
        return dt;
    }

    function makeEndtime(start, durationMin) {
        return new Date(start.getTime() + durationMin * 60000);
    }

    db.showtime.insertMany([
        {
            movieId: getMovieId("Interestelar"),
            showDate: ISODate(today.toISOString().split('T')[0]),
            startTime: makeShowtime(today, 14, 30),
            endTime: makeEndtime(makeShowtime(today, 14, 30), 169),
            languageFormat: "Subtitulada",
            baseTicketPrice: NumberDecimal("18.00"),
            status: "Disponible",
            roomId: 1,
            venueId: 1,
            availableSeats: 80
        },
        {
            movieId: getMovieId("Interestelar"),
            showDate: ISODate(today.toISOString().split('T')[0]),
            startTime: makeShowtime(today, 18, 00),
            endTime: makeEndtime(makeShowtime(today, 18, 00), 169),
            languageFormat: "Subtitulada",
            baseTicketPrice: NumberDecimal("20.00"),
            status: "Disponible",
            roomId: 1,
            venueId: 1,
            availableSeats: 80
        },
        {
            movieId: getMovieId("Interestelar"),
            showDate: ISODate(tomorrow.toISOString().split('T')[0]),
            startTime: makeShowtime(tomorrow, 16, 00),
            endTime: makeEndtime(makeShowtime(tomorrow, 16, 00), 169),
            languageFormat: "Subtitulada",
            baseTicketPrice: NumberDecimal("18.00"),
            status: "Disponible",
            roomId: 4,
            venueId: 2,
            availableSeats: 100
        },
        {
            movieId: getMovieId("Sonic 3"),
            showDate: ISODate(today.toISOString().split('T')[0]),
            startTime: makeShowtime(today, 15, 00),
            endTime: makeEndtime(makeShowtime(today, 15, 00), 110),
            languageFormat: "Doblada",
            baseTicketPrice: NumberDecimal("15.00"),
            status: "Disponible",
            roomId: 2,
            venueId: 1,
            availableSeats: 60
        },
        {
            movieId: getMovieId("Sonic 3"),
            showDate: ISODate(tomorrow.toISOString().split('T')[0]),
            startTime: makeShowtime(tomorrow, 11, 00),
            endTime: makeEndtime(makeShowtime(tomorrow, 11, 00), 110),
            languageFormat: "Doblada",
            baseTicketPrice: NumberDecimal("12.00"),
            status: "Disponible",
            roomId: 2,
            venueId: 1,
            availableSeats: 60
        },
        {
            movieId: getMovieId("El Conjuro 4"),
            showDate: ISODate(today.toISOString().split('T')[0]),
            startTime: makeShowtime(today, 20, 00),
            endTime: makeEndtime(makeShowtime(today, 20, 00), 120),
            languageFormat: "Subtitulada",
            baseTicketPrice: NumberDecimal("22.00"),
            status: "Disponible",
            roomId: 3,
            venueId: 1,
            availableSeats: 40
        },
        {
            movieId: getMovieId("El Conjuro 4"),
            showDate: ISODate(tomorrow.toISOString().split('T')[0]),
            startTime: makeShowtime(tomorrow, 19, 30),
            endTime: makeEndtime(makeShowtime(tomorrow, 19, 30), 120),
            languageFormat: "Subtitulada",
            baseTicketPrice: NumberDecimal("22.00"),
            status: "Disponible",
            roomId: 5,
            venueId: 2,
            availableSeats: 70
        }
    ]);
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: mongodb-cartelera
  name: mongodb-cartelera-cm1
