spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[1].id=cartelera-service
spring.cloud.gateway.routes[1].uri=lb://cartelera-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/movies/**,/api/v1/showtimes/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[2].id=usuarios-service
spring.cloud.gateway.routes[2].uri=lb://usuarios-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/documents/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[3].id=sucursales-service
spring.cloud.gateway.routes[3].uri=lb://sucursales-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/venues/**,/api/v1/locations/**,/api/v1/rooms/**,/api/v1/seats/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[4].id=confiteria-service
spring.cloud.gateway.routes[4].uri=lb://confiteria-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/snacks/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0