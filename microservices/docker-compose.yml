services:

  # ============================
  # BASES DE DATOS 
  # ============================

  mysql-sucursales:
    image: mysql:8
    container_name: mysql-sucursales
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cine123
      MYSQL_USER: cine
      MYSQL_PASSWORD: cine123
      MYSQL_DATABASE: sucursales_db
    volumes:
      - mysqldata-sucursales:/var/lib/mysql
      - ./init-scripts/mysql-sucursales:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pcine123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  mysql-confiteria:
    image: mysql:8
    container_name: mysql-confiteria
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cine123
      MYSQL_USER: cine
      MYSQL_PASSWORD: cine123
      MYSQL_DATABASE: confiteria_db
    volumes:
      - mysqldata-confiteria:/var/lib/mysql
      - ./init-scripts/mysql-confiteria:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pcine123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
  mongodb-cartelera:
    image: mongo:7
    container_name: mongodb-cartelera
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cine
      MONGO_INITDB_ROOT_PASSWORD: cine123
    volumes:
      - mongodata-cartelera:/data/db
      - ./init-scripts/mongodb-cartelera:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres-usuarios:
    image: postgres:16
    container_name: postgres-usuarios
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine123
      POSTGRES_DB: usuarios_db
    volumes:
      - pgdata-usuarios:/var/lib/postgresql/data
      - ./init-scripts/postgres-usuarios:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cine -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================
  # FACTURACION
  # ============================

  postgres-facturacion:
    image: postgres:16
    container_name: postgres-facturacion
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine123
      POSTGRES_DB: sales_db
    volumes:
      - pgdata-facturacion:/var/lib/postgresql/data
      - ./init-scripts/postgres-facturacion:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cine -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================
  # INFRAESTRUCTURA
  # ============================

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build: ./config-server
    image: cinemax/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/auth-service/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  service-discovery:
    build: ./service-discovery
    image: cinemax/service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    image: cinemax/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ============================
  # MICROSERVICIOS DE NEGOCIO
  # ============================

  auth-service:
    build: ./auth-service
    image: cinemax/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
      - JWT_EXPIRATION=86400000
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  sucursales-service:
    build: ./sucursales-service
    image: cinemax/sucursales-service
    container_name: sucursales-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-sucursales:3306/sucursales_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=cine
      - SPRING_DATASOURCE_PASSWORD=cine123
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
    depends_on:
      mysql-sucursales:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  cartelera-service:
    build: ./cartelera-service
    image: cinemax/cartelera-service
    container_name: cartelera-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATA_MONGODB_HOST=mongodb-cartelera
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_USERNAME=cine
      - SPRING_DATA_MONGODB_PASSWORD=cine123
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
    depends_on:
      mongodb-cartelera:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  confiteria-service:
    build: ./confiteria-service
    image: cinemax/confiteria-service
    container_name: confiteria-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-confiteria:3306/confiteria_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=cine
      - SPRING_DATASOURCE_PASSWORD=cine123
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
    depends_on:
      mysql-confiteria:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  usuarios-service:
    build: ./usuarios-service
    image: cinemax/usuarios-service
    container_name: usuarios-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      - SPRING_DATASOURCE_USERNAME=cine
      - SPRING_DATASOURCE_PASSWORD=cine123
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
    depends_on:
      postgres-usuarios:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  facturacion-service:
    build: ./facturacion-service
    image: cinemax/facturacion-service
    container_name: facturacion-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-facturacion:5432/sales_db
      - SPRING_DATASOURCE_USERNAME=cine
      - SPRING_DATASOURCE_PASSWORD=cine123
      - JWT_SECRET=586E3272357538782F413F4428472B4B6250655368566B597033733676397924
    depends_on:
      postgres-facturacion:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysqldata-sucursales:
  mysqldata-confiteria:
  mongodata-cartelera:
  pgdata-usuarios:
  pgdata-facturacion: