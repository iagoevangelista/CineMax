
<div class="movies-header">
  <div class="container">
    <h1 class="movies-title">Cartelera</h1>
    <p class="movies-subtitle">Encuentra tu próxima película favorita</p>
  </div>
</div>

<div class="container">
  <div class="tabs-bar">
    <button
      *ngFor="let tab of tabs"
      class="tab-btn"
      [class.tab-activo]="tabActivo === tab"
      (click)="cargarPorTab(tab)">
      {{ tab }}
    </button>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-light"></div>
</div>

<div class="container pb-5" *ngIf="!loading">

  <div *ngIf="peliculasFiltradas.length === 0 && !error" class="sin-resultados">
    <span>🎬</span>
    <p>No hay películas en esta categoría por ahora.</p>
  </div>

  <div *ngIf="error" class="sin-resultados">
    <span>⚠️</span>
    <p>No se pudo conectar al servidor. Intenta de nuevo.</p>
  </div>

  <div class="movies-grid" *ngIf="peliculasFiltradas.length > 0">
    <div
      *ngFor="let pelicula of peliculasFiltradas"
      class="movie-card"
      [routerLink]="['/movie', pelicula.idMovie]">

      <div class="movie-poster-wrap">
        <img [src]="pelicula.posterUrl" [alt]="pelicula.titleMovie" class="movie-poster-img">
        <div class="movie-overlay">
          <button class="btn-ver-detalle">Ver detalle</button>
        </div>
        <div *ngIf="pelicula.premiereWeek" class="badge-estreno-grid">Estreno</div>
        <div *ngIf="pelicula.rating" class="badge-rating">{{ pelicula.rating }}</div>
      </div>

      <div class="movie-card-info">
        <h6 class="movie-card-title">{{ pelicula.titleMovie }}</h6>
        <span class="movie-card-status">{{ pelicula.status }}</span>
      </div>

    </div>
  </div>
</div>
