<div class="container mt-5">
  <section id="Homepage-Principal" class="screen active">

    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-12">
        <div id="CarruselPrincipal" class="carousel slide shadow" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#CarruselPrincipal" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#CarruselPrincipal" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#CarruselPrincipal" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#CarruselPrincipal" data-bs-slide-to="3"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="Imagenes/Estreno/morado.jpeg" class="d-block w-100" alt="Nuevos Estrenos">
            </div>
            <div class="carousel-item">
              <img src="https://static.cinepolis.com/img/front/11/2026318121640616-prin.jpg" class="d-block w-100" alt="Poster 1">
            </div>
            <div class="carousel-item">
              <img src="https://static.cinepolis.com/img/front/11/2026415152353291-prin.jpg" class="d-block w-100" alt="Poster 2">
            </div>
            <div class="carousel-item">
              <img src="https://static.cinepolis.com/img/front/11/2026325112451386-prin.jpg" class="d-block w-100" alt="Poster 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#CarruselPrincipal" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#CarruselPrincipal" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="filtro shadow-sm">
        <form class="row g-0 align-items-center">
          <div class="col-md-3 border-end-custom p-3">
            <label class="label-filtro">Por película</label>
            <select class="form-select select-minimal">
              <option selected>Película</option>
            </select>
          </div>
          <div class="col-md-3 border-end-custom p-3">
            <label class="label-filtro">Por ciudad</label>
            <select class="form-select select-minimal">
              <option selected>Dónde estás</option>
              <option value="lima">Lima</option>
              <option value="arequipa">Arequipa</option>
            </select>
          </div>
          <div class="col-md-3 border-end-custom p-3">
            <label class="label-filtro">Por cine</label>
            <select class="form-select select-minimal">
              <option selected>Elige tu sede</option>
            </select>
          </div>
          <div class="col-md-3 p-3 d-flex justify-content-center">
            <button type="submit" class="btn btn-filtrar-redondeado">
              <i class="fa-solid fa-sliders me-2"></i> Filtrar
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="container mt-5 px-4">
      <div class="mb-4 border-bottom-purple">
        <h2 class="fw-bold text-white d-inline-block border-bottom border-primary border-3 pb-2">EN CARTELERA</h2>
      </div>
      <div class="row g-3">

        <div class="col-md-4">
          <div class="poster-container h-100 shadow-purple" style="cursor:pointer" [routerLink]="['/movie', 1]">
            <img src="https://cdn.apis.cineplanet.com.pe/CDN/media/entity/get/FilmPosterGraphic/HO00002775?referenceScheme=HeadOffice&allowPlaceHolder=true" class="img-mosaico" alt="Mario">
            <div class="badge-estreno">Estreno</div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="row g-3 mb-3">

            <div class="col-md-6">
              <div class="poster-container h-100 shadow-purple position-relative" style="cursor:pointer" [routerLink]="['/movie', 2]">
                <img src="https://cdn.apis.cineplanet.com.pe/CDN/media/entity/get/FilmPosterGraphic/HO00002801?referenceScheme=HeadOffice&allowPlaceHolder=true" class="img-mosaico" alt="La Momia">
                <div class="badge-estreno">Estreno</div>
                <span class="badge bg-danger text-white position-absolute top-0 end-0 m-2 fs-6 rounded-pill shadow-sm">+17</span>
              </div>
            </div>

            <div class="col-md-6">
              <div class="poster-container h-100 shadow-purple position-relative" style="cursor:pointer" [routerLink]="['/movie', 3]">
                <img src="https://cdn.apis.cineplanet.com.pe/CDN/media/entity/get/FilmPosterGraphic/HO00002680?referenceScheme=HeadOffice&allowPlaceHolder=true" class="img-mosaico" alt="Fin del mundo">
                <div class="badge-estreno">Estreno</div>
              </div>
            </div>

          </div>
          <div class="row g-3">

            <div class="col-md-6">
              <div class="poster-container h-100 shadow-purple position-relative" style="cursor:pointer" [routerLink]="['/movie', 4]">
                <img src="https://cdn.apis.cineplanet.com.pe/CDN/media/entity/get/FilmPosterGraphic/HO00002837?referenceScheme=HeadOffice&allowPlaceHolder=true" class="img-mosaico" alt="Boulevard">
                <span class="badge bg-danger text-white position-absolute top-0 end-0 m-2 fs-6 rounded-pill shadow-sm">+14</span>
              </div>
            </div>

            <div class="col-md-6">
              <div class="ver-mas-card h-100 d-flex align-items-center justify-content-center text-center p-4 shadow-purple">
                <a (click)="irAMovies()" class="text-white text-decoration-none" style="cursor:pointer">
                  <i class="fa-solid fa-circle-plus fs-1 mb-3"></i><br>
                  <span class="fw-bold fs-4">Ver más películas</span>
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="container mt-5 pb-5">
      <div class="mb-4 border-bottom-purple">
        <h2 class="fw-bold text-white d-inline-block border-bottom border-primary border-3 pb-2 text-uppercase">Promociones Exclusivas</h2>
      </div>
      <div id="CarruselPromos" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#CarruselPromos" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#CarruselPromos" data-bs-slide-to="1"></button>
        </div>
        <div class="carousel-inner rounded-4 shadow-purple">
          <div class="carousel-item active">
            <img src="Imagenes/Promos/promo50.jpeg" class="d-block w-100 img-promo" alt="Promo 50">
          </div>
          <div class="carousel-item">
            <img src="Imagenes/Promos/combo_to_go.png" class="d-block w-100 img-promo" alt="Promo Combo To Go">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#CarruselPromos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#CarruselPromos" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

  </section>
</div>
