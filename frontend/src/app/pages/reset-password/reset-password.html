<div class="container-fluid d-flex align-items-center justify-content-center min-vh-100" style="background-color: #121212;">
  
  <div class="card bg-dark text-white border-secondary shadow-lg" style="width: 100%; max-width: 440px; border-radius: 8px; overflow: hidden;">
    
    <div class="card-header border-secondary text-center py-4" style="background-color: var(--primary-dark);">
      <img src="assets/Imagenes/Logo.png" alt="CINEMAX" style="width: 100px; margin-bottom: 15px;" onerror="this.onerror=null; this.src='assets/Imagenes/Logo.png';">
      <h4 class="mb-0 fw-bold text-white">Nueva Contraseña</h4>
    </div>

    <div class="card-body p-4">
      <p class="mb-4 text-center" style="color: #adb5bd;">Establece tus nuevas credenciales de acceso seguro.</p>

      <div *ngIf="errorMessage" class="alert alert-danger small py-2 d-flex align-items-center" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <div *ngIf="successMessage" class="alert alert-success small py-2 d-flex align-items-center" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <div>{{ successMessage }}</div>
      </div>

      <form *ngIf="token && !successMessage" (ngSubmit)="cambiarContrasena()">
        
        <div class="mb-4">
          <label class="form-label fw-bold">Nueva Contraseña:</label>
          <input type="password" class="form-control bg-dark text-white shadow-sm border-secondary" 
                 placeholder="Mínimo 6 caracteres" 
                 name="newPassword" 
                 [(ngModel)]="newPassword" 
                 required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Confirmar Contraseña:</label>
          <input type="password" class="form-control bg-dark text-white shadow-sm border-secondary" 
                 placeholder="Escribe la contraseña de nuevo" 
                 name="confirmPassword" 
                 [(ngModel)]="confirmPassword" 
                 required>
        </div>

        <div class="d-flex flex-column gap-3 mt-4">
          <button type="submit" [disabled]="loading" class="btn btn-success w-100 fw-bold text-white py-2">
            <span *ngIf="!loading">Guardar Cambios</span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
          </button>
          
          <a routerLink="/" class="btn btn-outline-light w-100 fw-bold py-2">
            Cancelar
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
