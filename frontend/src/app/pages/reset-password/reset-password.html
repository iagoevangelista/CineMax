<div class="container-fluid d-flex align-items-center justify-content-center min-vh-100" style="background-color: #121212;">
  <div class="card bg-dark text-white border-secondary shadow-lg" style="width: 100%; max-width: 440px; border-radius: 8px; overflow: hidden;">

    <div class="card-header border-secondary text-center py-4" style="background-color: var(--primary-dark);">
      <img src="assets/Imagenes/Logo.png" alt="CINEMAX" style="width: 100px; margin-bottom: 15px;">
      <h4 class="mb-0 fw-bold text-white">Nueva Contraseña</h4>
    </div>

    <div class="card-body p-4">
      <p class="mb-4 text-center" style="color: #adb5bd;">Establece tus nuevas credenciales de acceso seguro.</p>

      <div *ngIf="errorMessage" class="alert alert-danger small py-2 d-flex align-items-center" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <div *ngIf="successMessage" class="alert alert-success small py-2 d-flex align-items-center" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <div>{{ successMessage }}</div>
      </div>

      <!-- ✅ CAMBIO: [formGroup] en lugar de (ngSubmit) solo -->
      <form *ngIf="token && !successMessage" [formGroup]="resetForm" (ngSubmit)="cambiarContrasena()">

        <div class="mb-2">
          <label class="form-label fw-bold">Nueva Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarPassword ? 'text' : 'password'"
                   class="form-control bg-dark text-white border-secondary"
                   placeholder="Mínimo 6 caracteres"
                   formControlName="newPassword">
            <span class="input-group-text bg-dark border-secondary text-white" style="cursor:pointer"
                  (click)="mostrarPassword = !mostrarPassword">
              <i class="fa-regular" [ngClass]="mostrarPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
            </span>
          </div>
          <div *ngIf="nf['newPassword'].invalid && nf['newPassword'].touched"
               class="text-danger small mt-1 ps-1">
            <span *ngIf="nf['newPassword'].errors?.['required']">La contraseña es obligatoria.</span>
            <span *ngIf="nf['newPassword'].errors?.['minlength']">Mínimo 6 caracteres.</span>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Confirmar Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarConfirm ? 'text' : 'password'"
                   class="form-control bg-dark text-white border-secondary"
                   placeholder="Escribe la contraseña de nuevo"
                   formControlName="confirmPassword">
            <span class="input-group-text bg-dark border-secondary text-white" style="cursor:pointer"
                  (click)="mostrarConfirm = !mostrarConfirm">
              <i class="fa-regular" [ngClass]="mostrarConfirm ? 'fa-eye' : 'fa-eye-slash'"></i>
            </span>
          </div>
          <!-- Error de campo vacío -->
          <div *ngIf="nf['confirmPassword'].invalid && nf['confirmPassword'].touched"
               class="text-danger small mt-1 ps-1">
            <span *ngIf="nf['confirmPassword'].errors?.['required']">Debes confirmar la contraseña.</span>
          </div>
          <!-- ✅ Error cruzado: contraseñas no coinciden -->
          <div *ngIf="resetForm.errors?.['noCoinciden'] && nf['confirmPassword'].touched"
               class="text-danger small mt-1 ps-1">
            Las contraseñas no coinciden.
          </div>
        </div>

        <div class="d-flex flex-column gap-3 mt-4">
          <button type="submit" [disabled]="loading" class="btn btn-success w-100 fw-bold text-white py-2">
            <span *ngIf="!loading">Guardar Cambios</span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
          </button>
          <a routerLink="/" class="btn btn-outline-light w-100 fw-bold py-2">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
