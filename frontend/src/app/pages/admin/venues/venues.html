<div class="container mt-5 text-white">
  
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
    <h2 class="fw-bold text-uppercase" style="color: var(--primary-color);">Gestión de Sedes</h2>
    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevaSede">
  <i class="fa-solid fa-plus me-2"></i>Nueva Sede
</button>
  </div>

  <div class="table-responsive shadow-lg rounded" style="background-color: var(--surface-color);">
    <table class="table table-dark table-hover mb-0 align-middle">
      <thead>
        <tr style="border-bottom: 2px solid var(--primary-color);">
          <th class="p-3">ID</th>
          <th class="p-3">Nombre del Cine</th>
          <th class="p-3">Dirección</th>
          <th class="p-3">Departamento</th>
          <th class="p-3">Distrito</th>
          <th class="p-3">Estado</th>
          <th class="p-3 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sede of listaSedes">
          <td class="p-3 fw-bold">{{ sede.idVenue }}</td>
          <td class="p-3">{{ sede.nameVenue }}</td>
          <td class="p-3">{{ sede.addressVenue }}</td>
          <td class="p-3">{{ sede.departmentName }}</td>
          <td class="p-3">{{ sede.districtName }}</td>
          <td class="p-3">
            <span class="badge" [ngClass]="sede.status === 'Activo' ? 'bg-success' : 'bg-danger'">
              {{ sede.status }}
            </span>
          </td>
          <td class="p-3 text-center">
            <button class="btn btn-sm btn-outline-info me-2"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade text-dark" id="modalNuevaSede" tabindex="-1" aria-labelledby="modalNuevaSedeLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="background-color: #f8f9fa;">
      
      <div class="modal-header" style="background-color: var(--primary-color); color: white;">
        <h5 class="modal-title fw-bold" id="modalNuevaSedeLabel">Registrar Nueva Sede</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Nombre del Cine</label>
              <input type="text" class="form-control" placeholder="Ej: CineMax San Miguel">
            </div>
            
            <div class="col-md-6">
              <label class="form-label fw-bold">Teléfono</label>
              <input type="text" class="form-control" placeholder="Ej: 01-456-7890">
            </div>

            <div class="col-md-12">
              <label class="form-label fw-bold">Dirección Exacta</label>
              <input type="text" class="form-control" placeholder="Ej: Av. La Marina 2000">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-bold">Departamento</label>
              <select class="form-select">
                <option selected>Seleccione...</option>
                <option value="1">Lima</option>
                <option value="2">Arequipa</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-bold">Provincia</label>
              <select class="form-select">
                <option selected>Seleccione...</option>
                <option value="1">Lima</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-bold">Distrito</label>
              <select class="form-select">
                <option selected>Seleccione...</option>
                <option value="1">San Miguel</option>
                <option value="2">Surco</option>
              </select>
            </div>

            <div class="col-md-6 mt-4">
              <label class="form-label fw-bold">Estado Inicial</label>
              <select class="form-select border-success">
                <option value="Activo" selected>Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success fw-bold">Guardar Sede</button>
      </div>

    </div>
  </div>
</div>
